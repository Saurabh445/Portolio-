<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!-- Tab icon. The .ico comes first for legacy tab strips, then the SVG for
       anything that scales. Both render the same mark from favicon.svg. -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- iOS ignores SVG here, so it needs a real PNG. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Pacifico&family=Space+Grotesk:wght@300..700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Space+Grotesk:wght@300..700&display=swap">
  </noscript>
  <!-- The hero is a <picture>: phones and tablets (below lg) get
       center-top-image-only-smartphone.png and laptop width up gets portrait.png.
       The preload must mirror that split, otherwise every small screen downloads
       the desktop image before the <source> is parsed and then throws it away
       (~1.7MB wasted). -->
  <link rel="preload" as="image" type="image/png" href="/center-top-image-only-smartphone.png"
        media="(max-width: 1023px)" fetchpriority="high">
  <link rel="preload" as="image" type="image/png" href="/portrait.png"
        media="(min-width: 1024px)" fetchpriority="high">

  <title>SAURABH KUMAR</title>
  <meta name="title" content="SAURABH KUMAR">
  <meta name="description"
    content="Portfolio of Saurabh Kumar. Founder &amp; CEO of Beckkon Systems Pvt. Ltd. and Engineering Physics student at IIT (BHU), Varanasi. Product Strategy, Business Development, Technology &amp; Execution and Leadership.">
  <meta name="keywords"
    content="Founder, CEO, Beckkon Systems, Product Strategy, Business Development, Technology, Leadership, IIT BHU, Engineering Physics, Product Builder, Portfolio, Saurabh Kumar">
  <meta name="author" content="Saurabh Kumar">

  <meta property="og:type" content="website">
  <meta property="og:title" content="SAURABH KUMAR">
  <meta property="og:description"
    content="Building products, teams and technology for real-world impact. Founder &amp; CEO of Beckkon Systems Pvt. Ltd.">
  <meta property="og:image" content="/og-icon.png">
  <meta property="og:image:width" content="1254">
  <meta property="og:image:height" content="1254">
  <meta property="og:image:alt" content="Saurabh Kumar monogram">
  <meta property="og:site_name" content="Saurabh Kumar">

  <meta property="twitter:card" content="summary">
  <meta property="twitter:title" content="SAURABH KUMAR">
  <meta property="twitter:description"
    content="Building products, teams and technology for real-world impact. Founder &amp; CEO of Beckkon Systems Pvt. Ltd.">
  <meta property="twitter:image" content="/og-icon.png">
  <meta property="twitter:image:alt" content="Saurabh Kumar monogram">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Saurabh Kumar",
    "jobTitle": "Founder & CEO, Beckkon Systems Pvt. Ltd.",
    "knowsAbout": ["Product Strategy", "Business Development", "Technology & Execution", "Leadership", "Hardware", "IoT", "Software", "Digital Infrastructure", "Data Systems", "Automation"]
  }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.js"></script>
</body>

</html>
